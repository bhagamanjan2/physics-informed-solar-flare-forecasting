[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solarflare"
version = "0.1.0"
description = "Machine Learning for multi-horizon solar flare forecasting using NOAA GOES data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "nbformat>=5.9.0",
    "nbconvert>=7.16.0",
    "sunpy>=6.0.0"
]

[project.scripts]
solarflare = "solarflare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

